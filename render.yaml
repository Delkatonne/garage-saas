services:
  - type: web
    name: garage-saas
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - {key: PYTHON_VERSION, value: "3.12.3"}
      - {key: FLASK_APP, value: wsgi.py}
      - {key: APP_ENV, value: production}
      - {key: SECRET_KEY, generateValue: true}
      - {key: JWT_SECRET_KEY, generateValue: true}
      - {key: DATABASE_URL, fromDatabase: {name: garage-db, property: connectionString}}
      - {key: APP_BASE_URL, sync: false}        # ex. https://garage-saas.onrender.com
      - {key: MAIL_SERVER, sync: false}
      - {key: MAIL_USERNAME, sync: false}
      - {key: MAIL_PASSWORD, sync: false}
      - {key: MAIL_DEFAULT_SENDER, sync: false}
      - {key: CLOUDINARY_URL, sync: false}

  - type: cron
    name: garage-saas-purge
    runtime: python
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask purge-tokens
    envVars:
      - {key: FLASK_APP, value: wsgi.py}
      - {key: APP_ENV, value: production}
      - {key: SECRET_KEY, sync: false}
      - {key: DATABASE_URL, fromDatabase: {name: garage-db, property: connectionString}}

databases:
  - name: garage-db
    plan: basic-256mb
