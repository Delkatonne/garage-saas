{% extends "base.html" %}
{% block title %}Profil du garage{% endblock %}
{% block content %}
<section class="card">
  <h1>Profil du garage</h1>
  <div class="garage-head"><div id="logo" class="logo" aria-hidden="true"></div>
    <form data-api="/api/garage/logo" data-success="reload" class="inline">
      <label>Changer le logo<input name="logo" type="file" accept=".png,.jpg,.jpeg,.webp"></label>
      <span class="err" data-error-for="logo"></span>
      <button class="btn btn-ghost" type="submit">Envoyer</button>
    </form>
    <button class="btn btn-ghost" id="logo-delete" type="button">Supprimer le logo</button>
  </div>
  <form id="profile-form" data-api="/api/garage/profile" data-method="PATCH" data-json data-omit="email" novalidate>
    <label>Nom du garage<input name="nom_garage" maxlength="120"></label><span class="err" data-error-for="nom_garage"></span>
    <label>Chef de garage<input name="nom_chef_garage" maxlength="120"></label><span class="err" data-error-for="nom_chef_garage"></span>
    <label>Email (connexion)<input name="email" disabled></label>
    <label>Téléphone<input name="telephone" type="tel"></label><span class="err" data-error-for="telephone"></span>
    <label>Adresse<input name="adresse" maxlength="255"></label>
    <label>Ville<input name="ville" maxlength="100"></label>
    <label>IFU<input name="ifu"></label><span class="err" data-error-for="ifu"></span>
    <label>RCCM<input name="rccm"></label><span class="err" data-error-for="rccm"></span>
    <label>Devise<select name="devise"><option>XOF</option><option>XAF</option><option>EUR</option><option>USD</option><option>MAD</option><option>GNF</option><option>NGN</option><option>GHS</option></select></label>
    <label>Décimales de la devise<input name="devise_decimales" type="number" min="0" max="3"></label><span class="err" data-error-for="devise_decimales"></span>
    <label class="check"><input name="tva_active" type="checkbox"> Appliquer la TVA</label>
    <label>Taux de TVA (%)<input name="tva_taux" type="number" step="0.01" min="0" max="100"></label><span class="err" data-error-for="tva_taux"></span>
    <button class="btn" type="submit">Enregistrer</button>
  </form>
</section>
<section class="card">
  <h2>Changer mon mot de passe</h2>
  <form data-api="/api/auth/change-password" data-success="message" novalidate>
    <label>Mot de passe actuel<input name="ancien_mot_de_passe" type="password" autocomplete="current-password"></label><span class="err" data-error-for="ancien_mot_de_passe"></span>
    <label>Nouveau mot de passe<input name="mot_de_passe" type="password" minlength="8" autocomplete="new-password"></label><span class="err" data-error-for="mot_de_passe"></span>
    <label>Confirmer<input name="confirmation_mot_de_passe" type="password" autocomplete="new-password"></label><span class="err" data-error-for="confirmation_mot_de_passe"></span>
    <button class="btn" type="submit">Modifier</button>
  </form>
</section>
{% endblock %}
