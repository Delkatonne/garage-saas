{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Mot de passe oublié</h1>
  <p>Saisissez l'email de votre compte : vous recevrez un lien valable 30 minutes.</p>
  <form data-api="/api/auth/forgot-password" data-success="message" novalidate>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <span class="err" data-error-for="email"></span>
    <button class="btn" type="submit">Envoyer le lien</button>
  </form>
</section>
{% endblock %}
