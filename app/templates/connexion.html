{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Connexion</h1>
  <form data-api="/api/auth/login" data-redirect="/tableau-de-bord" novalidate>
    <label>Email<input name="email" type="email" required autocomplete="username"></label>
    <label>Mot de passe<input name="mot_de_passe" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Se connecter</button>
  </form>
  <p class="muted"><a href="/mot-de-passe-oublie">Mot de passe oublié ?</a> · <a href="/inscription">Créer un garage</a></p>
</section>
{% endblock %}
